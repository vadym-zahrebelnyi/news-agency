<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center" href="{% url 'newspaper:index' %}">
      <span class="bg-dark text-white rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 32px; height: 32px;">
        <i class="bi bi-newspaper" style="font-size: 0.9rem;"></i>
      </span>
      DAILY NEWS
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item mx-lg-2">
          <a class="nav-link px-3 rounded-pill {% if 'article' in request.path %}bg-primary-subtle text-primary fw-bold active{% endif %}"
             href="{% url 'newspaper:article-list' %}">
            <i class="bi bi-journal-text me-1"></i> Articles
          </a>
        </li>

        <li class="nav-item mx-lg-2">
          <a class="nav-link px-3 rounded-pill {% if 'redactor' in request.path %}bg-success-subtle text-success fw-bold active{% endif %}"
             href="{% url 'newspaper:redactor-list' %}">
            <i class="bi bi-people me-1"></i> Redactors
          </a>
        </li>

        <li class="nav-item mx-lg-2">
          <a class="nav-link px-3 rounded-pill {% if 'topic' in request.path %}bg-warning-subtle text-warning-emphasis fw-bold active{% endif %}"
             href="{% url 'newspaper:topic-list' %}">
            <i class="bi bi-hash me-1"></i> Topics
          </a>
        </li>
      </ul>

      <div class="d-flex align-items-center">
        {% if user.is_authenticated %}
          <div class="dropdown">
            <a class="btn btn-light rounded-pill px-3 d-flex align-items-center dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle me-2 text-muted"></i>
              <span class="small fw-semibold">{{ user.username }}</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
              <li>
                <a class="dropdown-item py-2" href="{% url 'newspaper:redactor-detail' pk=user.id %}">
                  <i class="bi bi-person me-2"></i> My Profile
                </a>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <form action="{% url 'logout' %}" method="post" class="px-3 py-1">
                  {% csrf_token %}
                  <button type="submit" class="btn btn-sm btn-outline-danger w-100 rounded-pill">
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                  </button>
                </form>
              </li>
            </ul>
          </div>
        {% else %}
          <a href="{% url 'login' %}" class="btn btn-dark rounded-pill px-4 btn-sm">Sign In</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
