{% extends "base.html" %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5 text-center">
      <div class="card shadow-sm border-0 py-4">
        <div class="card-body">
          <i class="bi bi-exclamation-triangle text-danger fs-1 mb-3"></i>
          <h2 class="h4">Delete Topic?</h2>
          <p class="text-muted">Are you sure you want to delete topic: <strong>{{ topic.name }}</strong>?</p>

          <form action="" method="post" class="mt-4">
            {% csrf_token %}
            <div class="d-grid gap-2 d-md-block">
              <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
              <a href="{% url 'newspaper:topic-list' %}" class="btn btn-light px-4">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
