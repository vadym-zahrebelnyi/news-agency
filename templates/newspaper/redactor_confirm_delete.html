{% extends "base.html" %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 text-center">
      <div class="card shadow-sm border-0 py-4 rounded-3">
        <div class="card-body">
          <i class="bi bi-person-x text-danger mb-3" style="font-size: 3.5rem;"></i>
          <h2 class="h4 fw-bold">Delete Redactor?</h2>
          <p class="text-muted px-3">
            Are you sure you want to delete account: <strong class="text-dark">@{{ object.username }}</strong>?
          </p>

          <form action="" method="post" class="mt-4">
            {% csrf_token %}
            <div class="d-grid gap-2 d-md-flex justify-content-center">
              <button type="submit" class="btn btn-danger px-4 rounded-pill shadow-sm fw-bold">
                Yes, Delete
              </button>
              <a href="{% url 'newspaper:redactor-detail' pk=object.id %}" class="btn btn-light px-4 rounded-pill border">
                Cancel
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
