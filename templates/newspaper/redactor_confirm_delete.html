{% extends "base.html" %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5 text-center">
      <div class="card shadow-sm border-0 py-4">
        <div class="card-body">
          <div class="position-relative d-inline-block mb-3">
            <i class="bi bi-person-x text-danger" style="font-size: 4rem;"></i>
          </div>

          <h2 class="h4 fw-bold">Delete Redactor?</h2>
          <p class="text-muted px-3">
            Are you sure you want to delete the account of
            <strong class="text-dark">@{{ object.username }}</strong>?
            This action cannot be undone.
          </p>

          <form action="" method="post" class="mt-4">
            {% csrf_token %}
            <div class="d-grid gap-2 d-md-flex justify-content-center">
              <button type="submit" class="btn btn-danger px-4 shadow-sm">
                <i class="bi bi-trash me-1"></i> Yes, Delete Account
              </button>
              <a href="{% url 'newspaper:redactor-detail' pk=object.id %}" class="btn btn-light px-4 border">
                Cancel
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
