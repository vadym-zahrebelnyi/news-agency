{% extends "base.html" %}

{% block content %}
  <div class="row justify-content-center text-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-0 py-4">
        <div class="card-body">
          <h1 class="h4 mb-3">Delete Article</h1>
          <p class="text-muted mb-4">Are you sure you want to delete article: <br>
            <strong class="text-dark">"{{ article.title }}"</strong>?
          </p>

          <form action="" method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-2">
              <a href="{% url 'newspaper:article-detail' pk=article.id %}" class="btn btn-light px-4">Cancel</a>
              <button type="submit" class="btn btn-danger px-4">Confirm Delete</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
