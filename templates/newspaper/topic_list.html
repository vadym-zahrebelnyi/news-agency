{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3">Topics</h1>
    <a href="{% url 'newspaper:topic-create' %}" class="btn btn-primary btn-sm px-3">
      <i class="bi bi-plus-lg"></i> Add Topic
    </a>
  </div>

  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body bg-light rounded p-3">
      <form method="get" action="" class="row g-2">
        <div class="col-md-4">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-white border-end-0">
              <i class="bi bi-search text-muted"></i>
            </span>
            <input type="text"
                   name="name"
                   class="form-control form-control-sm border-start-0"
                   placeholder="Search topics..."
                   value="{{ request.GET.name|default:'' }}">
          </div>
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-secondary btn-sm px-4">Search</button>
          {% if request.GET.name %}
            <a href="{% url 'newspaper:topic-list' %}" class="btn btn-outline-secondary btn-sm">Reset</a>
          {% endif %}
        </div>
      </form>
    </div>
  </div>

  <div class="card shadow-sm border-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="ps-4">Topic Name</th>
            <th class="text-end pe-4">Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for topic in topic_list %}
            <tr>
              <td class="ps-4 fw-medium text-dark">{{ topic.name }}</td>
              <td class="text-end pe-4">
                <div class="btn-group">
                  <a href="{% url 'newspaper:topic-update' pk=topic.id %}"
                     class="btn btn-sm btn-link text-secondary text-decoration-none">
                    <i class="bi bi-pencil"></i> Edit
                  </a>
                  <a href="{% url 'newspaper:topic-delete' pk=topic.id %}"
                     class="btn btn-sm btn-link text-danger text-decoration-none">
                    <i class="bi bi-trash"></i> Delete
                  </a>
                </div>
              </td>
            </tr>
          {% empty %}
            <tr>
              <td colspan="2" class="text-center py-5 text-muted">No topics found.</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

  {% include "includes/pagination.html" %}

{% endblock %}
