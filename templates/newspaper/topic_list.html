{% extends "base.html" %}

{% block content %}
<div class="container py-2">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold h3 text-dark mb-0">Topics</h1>
    <a href="{% url 'newspaper:topic-create' %}" class="btn btn-warning btn-sm rounded-pill px-3 fw-bold shadow-sm">
      <i class="bi bi-plus-lg me-1"></i> New Topic
    </a>
  </div>

  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body bg-light rounded-3 p-2 px-3">
      <form method="get" action="" class="row g-2 align-items-center">
        <div class="col-auto" style="min-width: 250px;">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-white border-end-0 text-muted">
              <i class="bi bi-search small"></i>
            </span>
            <input type="text" name="name" class="form-control border-start-0 px-2"
                   placeholder="Search topics..."
                   value="{{ search_form.name.value|default:'' }}">
          </div>
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-dark btn-sm px-3">Search</button>
          {% if search_form.name.value %}
            <a href="{% url 'newspaper:topic-list' %}" class="btn btn-link btn-sm text-decoration-none text-muted">Reset</a>
          {% endif %}
        </div>
      </form>
    </div>
  </div>

  <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="bg-warning-subtle border-bottom">
          <tr>
            <th class="ps-4 py-3 text-warning-emphasis small text-uppercase fw-bold">Topic Name</th>
            <th class="py-3 text-warning-emphasis small text-uppercase fw-bold text-center">Related Articles</th>
            <th class="pe-4 py-3 text-end text-warning-emphasis small text-uppercase fw-bold">Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for topic in topic_list %}
            <tr>
              <td class="ps-4">
                <span class="fw-bold text-dark text-uppercase" style="letter-spacing: 0.5px;">
                  <i class="bi bi-hash text-warning-emphasis me-1"></i>{{ topic.name }}
                </span>
              </td>
              <td class="text-center">
                <span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle rounded-pill px-3 fw-bold">
                  {{ topic.num_articles }} articles
                </span>
              </td>
              <td class="pe-4 text-end">
                <div class="btn-group">
                  <a href="{% url 'newspaper:topic-update' pk=topic.id %}" class="btn btn-sm btn-outline-secondary border-0 rounded-circle me-1"><i class="bi bi-pencil-square"></i></a>
                  <a href="{% url 'newspaper:topic-delete' pk=topic.id %}" class="btn btn-sm btn-outline-danger border-0 rounded-circle"><i class="bi bi-trash"></i></a>
                </div>
              </td>
            </tr>
          {% empty %}
            <tr><td colspan="3" class="text-center py-5 text-muted">No topics found.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

</div>
{% endblock %}
