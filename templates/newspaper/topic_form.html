{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
          <h1 class="h4 mb-0">{{ object|yesno:"Update,Create" }} Topic</h1>
        </div>
        <div class="card-body p-4">
          <form action="" method="post" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-flex justify-content-between mt-4">
              <a href="{% url 'newspaper:topic-list' %}" class="btn btn-outline-secondary">Cancel</a>
              <button type="submit" class="btn btn-primary px-4">Save Topic</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
